<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Vault 25 — AR Paddock</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- A-Frame + AR.js: versies MOETEN bij elkaar passen.
       AR.js 3.4.7 vereist A-Frame 1.6.0 (3.4.4 en lager vereisen juist 1.0.4).
       Niet los van elkaar upgraden! -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- three.js-laag met de location-based logica (moet vóór aframe-ar.js) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/three.js/build/ar-threex-location-only.js"></script>
  <!-- AR.js A-Frame componenten (gps-new-camera / gps-new-entity-place) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body>

  <!-- HUD -->
  <div id="hud">
    <span class="tag" id="theme-label"></span>
    <span class="tag">Buiten <b id="stat-outside">0</b> · Terug <b id="stat-returned">0</b> · Tas <b id="stat-inv">0</b></span>
  </div>
  <div id="reticle"></div>
  <div id="aim-info"></div>
  <div id="flash"></div>
  <div id="loot"></div>
  <div id="toast"></div>
  <div id="gpsstatus" hidden></div>

  <!-- Bediening -->
  <button id="btn-recenter" class="hudbtn" hidden>⟲ ZET VOOR MIJ</button>
  <button id="btn-bag" class="hudbtn">🎒 TAS</button>
  <button id="btn-action" class="actionbtn k-none"><span id="action-label">VUUR</span></button>

  <!-- Tas -->
  <div id="bag" class="panel" hidden>
    <h3>TAS</h3>
    <ul id="bag-list"></ul>
    <button class="btn small" id="btn-turnin"></button>
    <div id="turnin-box" hidden>
      <div id="turnin-code"></div>
      <p id="turnin-help"></p>
      <button class="btn small danger" id="btn-clear">CODE GEZIEN — TAS LEEGMAKEN</button>
    </div>
    <button class="btn small ghost" id="btn-bag-close">SLUIT</button>
  </div>

  <!-- Startknop (kamer/hier: iOS wil een tik voor sensoren en camera) -->
  <div id="tapstart" hidden>
    <button class="btn" id="tapstart-btn">TIK OM TE STARTEN</button>
    <p id="tapstart-info"></p>
  </div>

  <div id="loader">
    <div class="spin"></div>
    <span class="loader-text">Paddock laden…</span>
  </div>

  <!-- Logica: volgorde is belangrijk -->
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/farm-builder.js"></script>
  <script src="js/animal.js"></script>
  <script src="js/wildlife.js"></script>
  <script src="js/interact.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bootstrap.js"></script>
</body>
</html>
