<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vault 25 — Code controleren</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="scroll">
  <div class="start">
    <h1>CODE CONTROLE</h1>
    <h2>Alleen voor SL's en handelaren</h2>
    <p>Typ of plak de code van de speler. Klopt de controlecode, dan zie je wat
       er ingeleverd wordt. Noteer het volgnummer om dubbel inleveren te herkennen.</p>
    <input id="code" class="codein" placeholder="V25-K7-TAT4-VLS2-9QX2" autocomplete="off" autocapitalize="characters" spellcheck="false" />
    <div id="result"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/inventory.js"></script>
  <script>
    const inp = document.getElementById('code');
    const out = document.getElementById('result');
    const seen = JSON.parse(localStorage.getItem('v25-gezien') || '[]');
    function check() {
      const raw = inp.value.trim();
      if (!raw) { out.innerHTML = ''; return; }
      const r = V25.inv.checkCode(raw);
      if (!r.items) { out.innerHTML = `<p class="bad">✗ ${r.reason}</p>`; return; }
      const list = r.items.map(i => `<li><span>${i.label}</span><b>${i.n}</b></li>`).join('');
      const dup = r.ok && seen.includes(raw.toUpperCase());
      out.innerHTML = r.ok
        ? `<p class="good">✓ Geldig — volgnummer ${r.serial}</p>
           ${dup ? '<p class="bad">⚠ Deze code is op dit apparaat al eens afgevinkt!</p>' : ''}
           <ul class="itemlist">${list}</ul>
           <button class="btn small" id="mark">AFVINKEN (UITBETAALD)</button>`
        : `<p class="bad">✗ ${r.reason}</p><ul class="itemlist">${list}</ul>`;
      const m = document.getElementById('mark');
      if (m) m.onclick = () => {
        seen.push(raw.toUpperCase());
        try { localStorage.setItem('v25-gezien', JSON.stringify(seen)); } catch (e) {}
        check();
      };
    }
    inp.addEventListener('input', check);
  </script>
</body>
</html>
